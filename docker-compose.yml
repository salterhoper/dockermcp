name: dockdeploy

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: dockdeploy:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8081}
      PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SQLite is used by default when DATABASE_URL is unset.
      # Persistent storage path mapped to the dockdeploy-data volume:
      SQLITE_PATH: ${SQLITE_PATH:-/home/app/data/dockdeploy.db}
      # To use PostgreSQL instead, set DATABASE_URL in your .env:
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Google-backed MCP OAuth (optional). Leave blank to keep the MCP endpoint
      # on API-token auth only. See .env.example for setup.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_ALLOWED_DOMAINS: ${MCP_OAUTH_ALLOWED_DOMAINS:-}
      MCP_OAUTH_TOKEN_TTL_DAYS: ${MCP_OAUTH_TOKEN_TTL_DAYS:-90}
      # Fixed confidential OAuth client for platform connectors (e.g. Gemini)
      # that use a client id/secret instead of dynamic registration.
      MCP_OAUTH_STATIC_CLIENT_ID: ${MCP_OAUTH_STATIC_CLIENT_ID:-}
      MCP_OAUTH_STATIC_CLIENT_SECRET: ${MCP_OAUTH_STATIC_CLIENT_SECRET:-}
      MCP_OAUTH_STATIC_REDIRECT_URIS: ${MCP_OAUTH_STATIC_REDIRECT_URIS:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8081}:8081"
    volumes:
      # Persists SQLite database and application data
      - dockdeploy-data:/home/app/data
      # Lets the controller manage its own host as a "local" server.
      # Comment out if you only ever manage remote machines over SSH.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dockdeploy-data:
